<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="corpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#050B1A"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#FDA085"/>
    </linearGradient>
    <linearGradient id="goldTrue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF94"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A2771F"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#corpBg)"/>

  <!-- Architectural Modern Grid Accent -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="500" y1="0" x2="500" y2="750"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>

  <!-- Top Brand Mark -->
  <rect x="50" y="50" width="36" height="36" rx="8" fill="url(#goldTrue)"/>
  <text x="68" y="74" fill="#0B132B" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" text-anchor="middle">A</text>
  <text x="96" y="74" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="2">APEX CAPITAL</text>

  <!-- Badge -->
  <rect x="420" y="52" width="130" height="32" rx="16" fill="#1E293B" stroke="url(#goldTrue)" stroke-width="1"/>
  <text x="485" y="72" fill="url(#goldTrue)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">SUMMIT 2026</text>

  <!-- Header Headline -->
  <text x="50" y="180" fill="url(#goldTrue)" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="4">GLOBAL FINANCIAL LEADERSHIP</text>
  <text x="50" y="240" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="46" font-weight="900" letter-spacing="1">SCALING VENTURES</text>
  <text x="50" y="295" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="46" font-weight="900" letter-spacing="1">&amp; WEALTH IN 2026</text>

  <text x="50" y="340" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="400">Join 1,200+ C-Suite Executives, Investors, and High-Growth Founders for Africa's Premier Private Equity &amp; Innovation Conference.</text>

  <!-- 3 Value Metric Cards -->
  <g transform="translate(50, 390)">
    <rect width="150" height="90" rx="12" fill="#141E33" stroke="#334155" stroke-width="1"/>
    <text x="75" y="42" fill="url(#goldTrue)" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" text-anchor="middle">$2.5B+</text>
    <text x="75" y="66" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">AUM REPRESENTED</text>
  </g>
  <g transform="translate(225, 390)">
    <rect width="150" height="90" rx="12" fill="#141E33" stroke="#334155" stroke-width="1"/>
    <text x="75" y="42" fill="url(#goldTrue)" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" text-anchor="middle">45+</text>
    <text x="75" y="66" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">GLOBAL KEYNOTES</text>
  </g>
  <g transform="translate(400, 390)">
    <rect width="150" height="90" rx="12" fill="#141E33" stroke="#334155" stroke-width="1"/>
    <text x="75" y="42" fill="url(#goldTrue)" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" text-anchor="middle">3 DAYS</text>
    <text x="75" y="66" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">DEAL NETWORKING</text>
  </g>

  <!-- Keynote Speaker Bar -->
  <rect x="50" y="520" width="500" height="90" rx="12" fill="#0E1726" stroke="url(#goldTrue)" stroke-width="1.2"/>
  <circle cx="95" cy="565" r="28" fill="#1E293B" stroke="url(#goldTrue)" stroke-width="1.5"/>
  <text x="95" y="571" fill="url(#goldTrue)" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle">EA</text>
  <text x="140" y="555" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Dr. Elizabeth Arthur-Mensah</text>
  <text x="140" y="575" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Managing Partner, Helios Global Capital</text>
  <text x="140" y="595" fill="url(#goldTrue)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">OPENING KEYNOTE SPEAKER</text>

  <!-- Event Dates & CTA -->
  <text x="50" y="655" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">DATE: NOV 10 - 12, 2026</text>
  <text x="50" y="675" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">KEMPINSKI HOTEL GOLD COAST CITY, ACCRA</text>

  <rect x="370" y="640" width="180" height="48" rx="8" fill="url(#goldTrue)"/>
  <text x="460" y="669" fill="#0B132B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">RESERVE SEAT →</text>
</svg>
