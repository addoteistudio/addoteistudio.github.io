<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="posterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#1D1820"/>
      <stop offset="100%" stop-color="#0E0D10"/>
    </linearGradient>
    <linearGradient id="goldBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#916E0A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#posterBg)"/>

  <!-- Stylized Saxophone / Brass Sound Waves -->
  <g transform="translate(300, 230)" opacity="0.8">
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#goldBrass)" stroke-width="1.5" stroke-dasharray="2 6"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#goldBrass)" stroke-width="2"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="35" fill="url(#goldBrass)" opacity="0.2"/>
    <path d="M-50 70 Q0 -60 60 -10 Q20 50 -10 120 Z" fill="url(#goldBrass)" opacity="0.85"/>
  </g>

  <!-- Title & Headline -->
  <text x="50" y="80" fill="url(#goldBrass)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="5">INTERNATIONAL CONTEMPORARY FESTIVAL</text>
  
  <text x="50" y="440" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="56" font-weight="900" letter-spacing="1">ECHOES OF</text>
  <text x="50" y="500" fill="url(#goldBrass)" font-family="'Playfair Display', serif" font-size="56" font-weight="900" font-style="italic" letter-spacing="2">MODERN JAZZ</text>

  <text x="50" y="550" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="400">A sensory celebration of afro-beat, smooth neo-soul, and world jazz acoustics featuring award-winning global virtuosos.</text>

  <!-- Footer Schedule Details -->
  <line x1="50" y1="590" x2="550" y2="590" stroke="#333" stroke-width="1"/>

  <g transform="translate(50, 620)">
    <text x="0" y="0" fill="url(#goldBrass)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">DATES</text>
    <text x="0" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">OCT 24 - 26</text>
  </g>

  <g transform="translate(220, 620)">
    <text x="0" y="0" fill="url(#goldBrass)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">LOCATION</text>
    <text x="0" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">NATIONAL THEATRE</text>
  </g>

  <g transform="translate(420, 620)">
    <text x="0" y="0" fill="url(#goldBrass)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2">TICKETS</text>
    <text x="0" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600">JAZZFEST.LIVE</text>
  </g>
</svg>
