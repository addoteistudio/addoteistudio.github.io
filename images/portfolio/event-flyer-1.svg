<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="eventBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="50%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#090710"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE79A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#eventBg)"/>
  <circle cx="300" cy="280" r="240" fill="url(#purpleGlow)"/>
  <circle cx="300" cy="380" r="200" fill="url(#goldGlow)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="560" height="710" rx="12" fill="none" stroke="url(#goldText)" stroke-width="1.5" opacity="0.5"/>
  <rect x="28" y="28" width="544" height="694" rx="8" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>

  <!-- Top Header -->
  <text x="300" y="70" fill="#E5E5EA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="6" text-anchor="middle">EXCLUSIVE NIGHTLIFE EXPERIENCE</text>
  <line x1="180" y1="85" x2="420" y2="85" stroke="url(#goldText)" stroke-width="1" opacity="0.6"/>

  <!-- Graphic Elements -->
  <circle cx="300" cy="240" r="110" fill="none" stroke="url(#goldText)" stroke-width="2" opacity="0.4"/>
  <circle cx="300" cy="240" r="85" fill="none" stroke="#FFFFFF" stroke-dasharray="4 8" stroke-width="1.5" opacity="0.3"/>
  <polygon points="300,160 360,260 240,260" fill="none" stroke="url(#goldText)" stroke-width="1.5" opacity="0.5"/>

  <text x="300" y="248" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="8" text-anchor="middle">A U R A</text>

  <!-- Main Headline -->
  <text x="300" y="410" fill="url(#goldText)" font-family="'Playfair Display', serif" font-size="44" font-weight="900" letter-spacing="3" text-anchor="middle">MIDNIGHT GALA</text>
  <text x="300" y="445" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="300" letter-spacing="8" text-anchor="middle">LUXURY &amp; CELEBRATION</text>

  <!-- Date & Venue -->
  <rect x="120" y="490" width="360" height="70" rx="8" fill="#141124" stroke="url(#goldText)" stroke-width="1" opacity="0.9"/>
  <text x="300" y="520" fill="url(#goldText)" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="3" text-anchor="middle">FRIDAY | 28 NOV 2026</text>
  <text x="300" y="542" fill="#AEAEB2" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="1.5" text-anchor="middle">THE GRAND ROYALE PALACE, SUITE A</text>

  <!-- DJ / Special Guests -->
  <text x="300" y="605" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" letter-spacing="2" text-anchor="middle">FEATURING INTERNATIONAL DJS &amp; LIVE ORCHESTRA</text>
  <text x="300" y="630" fill="#8E8E93" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="1.5" text-anchor="middle">BLACK TIE REQUIRED • VIP RESERVATIONS ONLY</text>

  <!-- Bottom Badge -->
  <rect x="220" y="665" width="160" height="35" rx="17.5" fill="url(#goldText)"/>
  <text x="300" y="687" fill="#111111" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="2" text-anchor="middle">GET TICKETS</text>
</svg>
