<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="sageGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D4B7"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8F7833"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="16" fill="url(#brandBg)"/>

  <!-- Mockup Business Cards & Stationery Layer -->
  <!-- Card 1 (Back) -->
  <g transform="translate(120, 140) rotate(-12)">
    <rect width="260" height="150" rx="8" fill="#1C1C1E" stroke="url(#sageGold)" stroke-width="1.2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>
    <!-- Logo Monogram -->
    <circle cx="130" cy="75" r="28" fill="none" stroke="url(#sageGold)" stroke-width="2"/>
    <path d="M120 75 Q130 55 140 75 Q130 95 120 75 Z" fill="url(#sageGold)"/>
  </g>

  <!-- Card 2 (Front) -->
  <g transform="translate(240, 240) rotate(6)">
    <rect width="260" height="150" rx="8" fill="#F8F8F8" stroke="#D1D5DB" stroke-width="1" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))"/>
    <circle cx="50" cy="45" r="16" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <path d="M44 45 Q50 33 56 45 Q50 57 44 45 Z" fill="#D4AF37"/>
    <text x="75" y="49" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" letter-spacing="2">SOLSTICE</text>
    
    <text x="50" y="95" fill="#111827" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Eleanor Vance</text>
    <text x="50" y="110" fill="#6B7280" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500">Chief Executive Officer</text>
    <text x="50" y="125" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">eleanor@solsticeorganics.com</text>
  </g>

  <!-- Brand Identity Details -->
  <text x="50" y="470" fill="url(#sageGold)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="4">COMPREHENSIVE BRAND IDENTITY</text>
  <text x="50" y="505" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="28" font-weight="800">Solstice Organic Skincare</text>
  <text x="50" y="535" fill="#9CA3AF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Logo mark, stationery suite, typography system, luxury gold hot-foil mockups, and digital guidelines.</text>
</svg>
