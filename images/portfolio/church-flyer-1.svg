<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="churchBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E121E"/>
      <stop offset="50%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="divineGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#E2B755"/>
      <stop offset="80%" stop-color="#C69214"/>
      <stop offset="100%" stop-color="#805600"/>
    </linearGradient>
    <radialGradient id="lightRay" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#E2B755" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0E121E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0E121E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="750" rx="16" fill="url(#churchBg)"/>
  <circle cx="300" cy="180" r="280" fill="url(#lightRay)"/>

  <!-- Ornate Decorative Borders -->
  <rect x="25" y="25" width="550" height="700" rx="8" fill="none" stroke="url(#divineGold)" stroke-width="1.5" opacity="0.6"/>
  <rect x="33" y="33" width="534" height="684" rx="4" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.2"/>

  <!-- Top Church Banner -->
  <text x="300" y="72" fill="#D1D5DB" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="4" text-anchor="middle">CHRIST EMBASSY &amp; GRACE TABERNACLE PRESENTS</text>
  
  <!-- Glowing Cross Symbol -->
  <g transform="translate(300, 150) scale(0.9)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#divineGold)" stroke-width="2" opacity="0.5"/>
    <path d="M-6 -38 L6 -38 L6 -10 L28 -10 L28 2 L6 2 L6 42 L-6 42 L-6 2 L-28 2 L-28 -10 L-6 -10 Z" fill="url(#divineGold)"/>
  </g>

  <!-- Conference Subtitle -->
  <text x="300" y="250" fill="#E5E7EB" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="6" text-anchor="middle">ANNUAL INTERNATIONAL CONVENTION 2026</text>

  <!-- Big Dramatic Typography -->
  <text x="300" y="320" fill="url(#divineGold)" font-family="'Playfair Display', serif" font-size="52" font-weight="900" letter-spacing="2" text-anchor="middle">GRACE &amp; GLORY</text>
  <text x="300" y="365" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="28" font-style="italic" letter-spacing="1" text-anchor="middle">"From Strength to Greater Glory"</text>

  <!-- Theme Scripture -->
  <text x="300" y="410" fill="#9CA3AF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" letter-spacing="2" text-anchor="middle">2 CORINTHIANS 3:18</text>
  <line x1="220" y1="425" x2="380" y2="425" stroke="url(#divineGold)" stroke-width="1.5"/>

  <!-- Host Details & Guest Ministers -->
  <rect x="70" y="460" width="460" height="95" rx="12" fill="#090D16" stroke="url(#divineGold)" stroke-width="1" opacity="0.8"/>
  <text x="300" y="490" fill="url(#divineGold)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="3" text-anchor="middle">HOSTED BY</text>
  <text x="300" y="515" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" letter-spacing="1" text-anchor="middle">APOSTLE DANIEL &amp; PASTOR RUTH MENSAH</text>
  <text x="300" y="538" fill="#9CA3AF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="1.5" text-anchor="middle">WITH GUEST WORSHIP MINISTERS</text>

  <!-- Date & Venue -->
  <g transform="translate(110, 580)">
    <rect width="180" height="50" rx="8" fill="#141C2E" stroke="#374151" stroke-width="1"/>
    <text x="90" y="22" fill="url(#divineGold)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">DATE</text>
    <text x="90" y="38" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">OCT 14 - 18, 2026</text>
  </g>
  <g transform="translate(310, 580)">
    <rect width="180" height="50" rx="8" fill="#141C2E" stroke="#374151" stroke-width="1"/>
    <text x="90" y="22" fill="url(#divineGold)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">TIME</text>
    <text x="90" y="38" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">5:30 PM DAILY</text>
  </g>

  <!-- Venue / Stream -->
  <text x="300" y="665" fill="#E5E7EB" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="1" text-anchor="middle">KINGDOM DOME, ACCRA CENTRAL • LIVE STREAM ON YOUTUBE &amp; FACEBOOK</text>
  <text x="300" y="690" fill="url(#divineGold)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">ADMISSION IS FREE • COME WITH EXPECTATION</text>
</svg>
