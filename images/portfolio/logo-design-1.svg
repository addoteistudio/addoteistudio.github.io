<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#E2B755"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="16" fill="url(#logoBg)"/>

  <!-- Minimalist Geometric Emblem -->
  <g transform="translate(300, 240)">
    <!-- Outer Octagon or Diamond Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#luxuryGold)" stroke-width="1.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#luxuryGold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Stylized Interlocking Monogram E & L -->
    <path d="M-40 -45 L20 -45 L20 -33 L-26 -33 L-26 -6 L15 -6 L15 6 L-26 6 L-26 33 L25 33 L25 45 L-40 45 Z" fill="url(#luxuryGold)"/>
    <path d="M-10 -30 L5 -30 L5 30 L40 30 L40 42 L-10 42 Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="0" cy="-60" r="4" fill="url(#luxuryGold)"/>
    <circle cx="0" cy="60" r="4" fill="url(#luxuryGold)"/>
  </g>

  <!-- Typography -->
  <text x="300" y="420" fill="url(#luxuryGold)" font-family="'Playfair Display', serif" font-size="34" font-weight="700" letter-spacing="8" text-anchor="middle">L'ÉLÉGANCE</text>
  <line x1="200" y1="445" x2="400" y2="445" stroke="url(#luxuryGold)" stroke-width="1" opacity="0.5"/>
  <text x="300" y="475" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" letter-spacing="9" text-anchor="middle">HAUTE HORLOGERIE • PARIS</text>
</svg>
