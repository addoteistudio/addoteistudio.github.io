<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="smBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A181B"/>
      <stop offset="50%" stop-color="#111012"/>
      <stop offset="100%" stop-color="#0A090B"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D4C8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="16" fill="url(#smBg)"/>
  
  <!-- Sleek Grid / Fashion Editorial Layout -->
  <rect x="30" y="30" width="540" height="540" rx="12" fill="none" stroke="#2D2B30" stroke-width="1"/>
  
  <!-- Inner Aesthetic Frame -->
  <rect x="60" y="60" width="480" height="340" rx="8" fill="#141316" stroke="url(#roseGold)" stroke-width="1" opacity="0.6"/>
  <circle cx="300" cy="230" r="90" fill="none" stroke="url(#roseGold)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="300" cy="230" r="70" fill="none" stroke="#FFFFFF" stroke-dasharray="3 6" stroke-width="1" opacity="0.3"/>

  <!-- Fashion Typography in Frame -->
  <text x="300" y="210" fill="#E4E4E7" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="6" text-anchor="middle">NEW EDITORIAL</text>
  <text x="300" y="250" fill="url(#roseGold)" font-family="'Playfair Display', serif" font-size="38" font-weight="900" letter-spacing="4" text-anchor="middle">VELVET NOIR</text>

  <!-- Bottom Content -->
  <text x="60" y="445" fill="url(#roseGold)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="3">SPRING / SUMMER '26</text>
  <text x="60" y="475" fill="#FFFFFF" font-family="'Playfair Display', serif" font-size="24" font-weight="700">The Anatomy of Pure Minimalism.</text>
  <text x="60" y="505" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">High-engagement social campaign kit crafted for luxury apparel &amp; footwear.</text>

  <!-- Social UI tags -->
  <rect x="440" y="535" width="100" height="30" rx="15" fill="url(#roseGold)"/>
  <text x="490" y="555" fill="#111111" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">SWIPE ➔</text>
</svg>
